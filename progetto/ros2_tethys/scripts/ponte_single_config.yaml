# ros_gz_bridge config per drone singolo (tethys).
# Mappa topic ROS2 validi ai topic Ignition effettivi.
# Le pinne usano il formato /0/cmd_pos (default JPC Fortress senza <topic> esplicito).

# Pinne verticali: ROS2 → Ignition
- ros_topic_name: "/model/tethys/vertical_fins/cmd_pos"
  gz_topic_name: "/model/tethys/joint/vertical_fins_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

# Pinne orizzontali: ROS2 → Ignition
- ros_topic_name: "/model/tethys/horizontal_fins/cmd_pos"
  gz_topic_name: "/model/tethys/joint/horizontal_fins_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

# Propulsore: ROS2 → Ignition
- ros_topic_name: "/model/tethys/joint/propeller_joint/cmd_thrust"
  gz_topic_name: "/model/tethys/joint/propeller_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

# Sonar: Ignition → ROS2
- ros_topic_name: "/model/tethys/frontal_sonar/points"
  gz_topic_name: "/model/tethys/frontal_sonar/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

- ros_topic_name: "/model/tethys/left_sonar/points"
